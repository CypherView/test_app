    <!-- MapLibre GL JS — required by maplibre_gl web (the OSM / flexible map
         engine); v5 per the plugin's install guide. Open-source, no token. -->
    <script src="https://unpkg.com/maplibre-gl@^5.24.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@^5.24.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script>
      // maplibre_gl web + Flutter platform views: the maplibre map is created
      // before Flutter finishes sizing its host element, and maplibre's
      // internal transform only tracks the container on a resize() call, so
      // the map paints into a stale (small) viewport. Capture each map and
      // call resize() whenever its transform no longer matches its container,
      // until it settles. Cheap no-op once matched.
      (function () {
        if (!window.maplibregl) return;
        var Orig = maplibregl.Map;
        window.__mlMaps = [];
        maplibregl.Map = function () {
          var m = new (Function.prototype.bind.apply(
            Orig, [null].concat(Array.prototype.slice.call(arguments))))();
          window.__mlMaps.push(m);
          return m;
        };
        maplibregl.Map.prototype = Orig.prototype;
        Object.setPrototypeOf(maplibregl.Map, Orig);

        var ticks = 0;
        var iv = setInterval(function () {
          ticks++;
          window.__mlMaps.forEach(function (m) {
            try {
              var c = m.getContainer();
              if (m.transform.width !== c.clientWidth ||
                  m.transform.height !== c.clientHeight) {
                m.resize();
              }
            } catch (e) {}
          });
          if (ticks >= 120) clearInterval(iv); // ~60s safety cap
        }, 500);
      })();
    </script>

    <!-- Mapbox GL JS (CHV-1646 POC) — required by mapbox_maps_flutter web
         (3.0.0-alpha.1 Public Preview); v3.25.0 is the minimum it supports. -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.25.0/mapbox-gl.css" rel="stylesheet" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.25.0/mapbox-gl.js"></script>
    <script>
      // CHV-1646 POC shim: mapbox_maps_flutter_web 3.0.0-alpha.1 does not
      // implement addStyleImage, so custom marker icons can't be registered
      // through the plugin. Capture every GL JS map instance so Dart can call
      // map.addImage() directly via JS interop (mapbox_gl_js_image_shim.dart).
      // Remove once the plugin implements addStyleImage on web.
      (function () {
        var Orig = mapboxgl.Map;
        window.__mapboxInstances = [];
        mapboxgl.Map = function () {
          var m = new (Function.prototype.bind.apply(
            Orig, [null].concat(Array.prototype.slice.call(arguments))))();
          window.__mapboxInstances.push(m);
          // The Flutter web alpha never calls map.resize(), so the canvas keeps
          // its construction-time size — leaving the rendered map and GL's own
          // coordinate transform out of sync (stretched paint, taps that miss
          // or hit the wrong feature). Observe the container and re-sync on any
          // size change so it always tracks the real layout.
          try {
            var container = m.getContainer();
            if (container && window.ResizeObserver) {
              var ro = new ResizeObserver(function () {
                try { m.resize(); } catch (e) {}
              });
              ro.observe(container);
            }
          } catch (e) {}
          return m;
        };
        mapboxgl.Map.prototype = Orig.prototype;
        Object.setPrototypeOf(mapboxgl.Map, Orig);

        // Cluster helpers for the same shim (queryRenderedFeatures is not
        // implemented in the Flutter web alpha either).
        window.__chvClusterAt = function (map, layerId, x, y) {
          if (!map.getLayer(layerId)) return null;
          var fs = map.queryRenderedFeatures([x, y], { layers: [layerId] });
          if (!fs.length) return null;
          var f = fs[0];
          return JSON.stringify({
            id: f.properties.cluster_id,
            lng: f.geometry.coordinates[0],
            lat: f.geometry.coordinates[1]
          });
        };
        window.__chvClusterExpand = function (map, sourceId, clusterId) {
          // getClusterExpansionZoom is callback-style in GL JS (verified on
          // v3.25) — adapt it to a Promise for Dart interop.
          return new Promise(function (resolve, reject) {
            map.getSource(sourceId).getClusterExpansionZoom(
              clusterId,
              function (err, zoom) {
                if (err) { reject(err); } else { resolve(zoom); }
              }
            );
          });
        };
      })();
    </script>

    <!-- Hardened CSP. Wildcards (*) removed from every directive and replaced
         with explicit allowlists. 'unsafe-inline' is retained ONLY on
         script-src/style-src because Flutter web's bootstrap and the map libs
         inject inline scripts/styles that cannot be nonced; 'wasm-unsafe-eval'
         is required by the CanvasKit/skwasm renderer. connect-src uses wildcard
         subdomains so runtime API/region switching (setCustomApiUrl) keeps
         working. worker-src blob: is required by Mapbox/MapLibre GL.
         ws/http localhost:59682 in connect-src is the local dev server: the
         DWDS debug client must reach it before it will run main(), so debug
         builds inside the Angular shell (localhost:4200) never boot without
         it. No effect in release builds, which contain no DWDS client. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob: https://unpkg.com https://api.mapbox.com https://js.api.here.com https://cdn.jsdelivr.net https://www.gstatic.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' blob: data: https://unpkg.com https://api.mapbox.com https://js.api.here.com https://fonts.googleapis.com; img-src 'self' blob: data: https://*.kt1.io https://*.cypherview.workers.dev https://maps.googleapis.com https://maps.gstatic.com https://maps.google.com https://tiles.openfreemap.org https://api.mapbox.com https://js.api.here.com https://*.here.com; font-src 'self' data: https://unpkg.com https://api.mapbox.com https://fonts.gstatic.com; media-src 'self' blob: data: https://actions.google.com; connect-src 'self' blob: data: ws://localhost:59682 http://localhost:59682 https://*.kt1.io https://*.cypherview.net https://*.cypherview.workers.dev wss://*.cypherview.workers.dev https://maps.googleapis.com https://routes.googleapis.com https://tiles.openfreemap.org https://api.mapbox.com https://js.api.here.com https://*.here.com https://www.gstatic.com https://fonts.gstatic.com; worker-src 'self' blob:; frame-src 'self' https://www.google.com https://accounts.google.com blob:; object-src 'none'; base-uri 'self';"
    />
  </head>
  <body>
    <script src="map_tooltip_helper.js"></script>
    <script src="flutter_bootstrap.js" async></script>
    <script>
      function addHereMarker(map, latitude, longitude) {
        console.log("Adding marker at:", latitude, longitude);
        try {
          const coords = new H.geo.Point(latitude, longitude);
          const marker = new H.map.Marker(coords);
          map.addObject(marker);
          map.setCenter(coords);
          map.setZoom(12);
          console.log("Marker added successfully");
          return marker;
        } catch (e) {
          console.error("Error in addHereMarker:", e);
        }
      }
    </script>

</html>
